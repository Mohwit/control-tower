[project]
name = "act"
version = "0.1.0"
description = "Agent Control Tower — harness SDK on top of pydantic-ai v2"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic-ai-slim>=0.2.0",
]

[project.optional-dependencies]
openai     = ["pydantic-ai-slim[openai]>=0.2.0"]
anthropic  = ["pydantic-ai-slim[anthropic]>=0.2.0"]
all        = ["pydantic-ai-slim[openai,anthropic,groq,mistral,ollama,vertexai]>=0.2.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["act"]
